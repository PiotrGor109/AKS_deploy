apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-frontend
  namespace: taskplanner
  labels:
    app: task-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-frontend
  template:
    metadata:
      labels:
        app: task-frontend
    spec:
      containers:
        - name: task-frontend
          image: taskplanneracr2026.azurecr.io/task-frontend:aks-test
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: task-frontend-service
  namespace: taskplanner
spec:
  type: ClusterIP
  selector:
    app: task-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
