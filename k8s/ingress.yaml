
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskplanner-ingress
  namespace: taskplanner
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-frontend-service
                port:
                  number: 80
