apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-backend
  namespace: taskplanner
  labels:
    app: task-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-backend
  template:
    metadata:
      labels:
        app: task-backend
    spec:
      containers:
        - name: task-backend
          image: taskplanneracr2026.azurecr.io/task-backend:aks-test
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "aks"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /tasks
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /tasks
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: task-backend-service
  namespace: taskplanner
spec:
  type: ClusterIP
  selector:
    app: task-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
